services:
  postgres:
    image: postgres:16
    container_name: samic-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samik_password}
      POSTGRES_DB: ${POSTGRES_DB:-samik_db}
    volumes:
      - samic_pgdata:/var/lib/postgresql/data

volumes:
  samic_pgdata:
    name: samic_pgdata
